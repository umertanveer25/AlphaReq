[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphareq"
version = "1.0.0"
description = "Automated Conflict Resolution and Autonomous Software Architecture Synthesis from Natural Language Requirements"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Umer Tanveer", email = "umer.research@openscience.org"}
]
keywords = [
    "requirements-engineering",
    "software-architecture",
    "non-functional-requirements",
    "conflict-resolution",
    "microservices",
    "promise-dataset"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.3.0",
    "python-docx>=0.8.11"
]

[project.scripts]
alphareq = "run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
